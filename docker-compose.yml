services:
  web:
    build:
      context: .
      target: web
    image: pileup-audit-web
    ports:
      # 宿主机端口可通过环境变量 WEB_PORT 配置，默认 8080
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  verify:
    build:
      context: .
      target: verify
    image: pileup-audit-verify
    depends_on:
      web:
        condition: service_healthy
    environment:
      WEB_URL: http://web
    # 一次性服务：执行完核验后自行退出，退出码即核验结果
