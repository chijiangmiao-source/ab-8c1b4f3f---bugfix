server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HTTP 健康检查端点
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 静态资源
    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }

    # 单页应用回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
